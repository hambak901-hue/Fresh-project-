<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline | HAMBAKTECH</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        font-family: sans-serif;
        background: #020617;
        color: #f8fafc;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 20px;
        padding: 28px 22px;
        text-align: center;
      }
      h1 { margin: 0 0 10px; font-size: 20px; color: #ffffff; }
      p { margin: 0 0 22px; font-size: 14px; line-height: 1.5; color: #94a3b8; }
      a.btn {
        display: block;
        width: 100%;
        padding: 13px 16px;
        border-radius: 12px;
        background: #1d4ed8;
        color: #ffffff;
        font-weight: 700;
        font-size: 14px;
        text-decoration: none;
      }
      .sub { margin-top: 16px; font-size: 11px; color: #64748b; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Connection Unavailable</h1>
      <p>
        Unable to reach HAMBAK TECH &amp; SERVICES servers. Check your mobile data or Wi-Fi connection and tap Retry.
      </p>
      <a class="btn" href="https://hambaktech.com.ng">Retry Connection</a>
      <div class="sub">HAMBAKTECH Android App &bull; hambaktech.com.ng</div>
    </div>
    <script>
      window.addEventListener('online', function() {
        window.location.replace('https://hambaktech.com.ng');
      });
    </script>
  </body>
</html>
