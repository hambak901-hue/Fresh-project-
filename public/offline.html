<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Offline | HAMBAK TECH &amp; SERVICES</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #020617;
        color: #f8fafc;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 1.5rem;
        padding: 2rem 1.75rem;
        text-align: center;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }
      .icon-wrap {
        width: 72px;
        height: 72px;
        margin: 0 auto 1.25rem;
        border-radius: 1.25rem;
        background: rgba(29, 78, 216, 0.16);
        border: 1px solid rgba(59, 130, 246, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .badge {
        display: inline-block;
        padding: 0.25rem 0.65rem;
        border-radius: 999px;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #93c5fd;
        background: rgba(30, 58, 138, 0.45);
        border: 1px solid rgba(59, 130, 246, 0.3);
        margin-bottom: 0.75rem;
      }
      h1 {
        margin: 0 0 0.6rem;
        font-size: 1.25rem;
        font-weight: 800;
        color: #ffffff;
      }
      p {
        margin: 0 0 1.5rem;
        font-size: 0.875rem;
        line-height: 1.55;
        color: #94a3b8;
      }
      button {
        width: 100%;
        padding: 0.8rem 1.25rem;
        border: 0;
        border-radius: 0.85rem;
        background: #1d4ed8;
        color: #ffffff;
        font-size: 0.875rem;
        font-weight: 700;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.99);
      }
      .meta {
        margin-top: 1.25rem;
        font-size: 0.72rem;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon-wrap">
        <img src="/pwa-192x192.png" alt="HAMBAKTECH" width="48" height="48" style="border-radius: 10px;" onerror="this.style.display='none'" />
      </div>
      <div class="badge">Connection Offline</div>
      <h1>No Internet Connection</h1>
      <p>
        HAMBAK TECH &amp; SERVICES needs an active internet connection for live wallet transactions,
        identity verification, and VTU services. Check mobile data or Wi-Fi and try again.
      </p>
      <button type="button" onclick="window.location.reload()">Try Connecting Again</button>
      <div class="meta">HAMBAK TECH &amp; SERVICES &bull; hambaktech.com.ng</div>
    </main>
    <script>
      window.addEventListener('online', function() {
        window.location.reload();
      });
    </script>
  </body>
</html>
