  </defs>

  <!-- Background Paper Layout -->
  <rect x="10" y="10" width="780" height="480" rx="12" fill="url(#longGrad)" stroke="#334155" stroke-width="2.5" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.1))"/>

  <!-- Barcode Top Section -->
  <g transform="translate(40, 25)">
