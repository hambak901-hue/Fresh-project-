    <rect x="0" y="5" width="3" height="35" fill="#000000"/>
    <rect x="6" y="5" width="2" height="35" fill="#000000"/>
    <rect x="11" y="5" width="5" height="35" fill="#000000"/>
    <rect x="19" y="5" width="2" height="35" fill="#000000"/>
    <rect x="24" y="5" width="4" height="35" fill="#000000"/>
    <rect x="31" y="5" width="2" height="35" fill="#000000"/>
    <rect x="36" y="5" width="6" height="35" fill="#000000"/>
    <rect x="45" y="5" width="3" height="35" fill="#000000"/>
    <rect x="51" y="5" width="2" height="35" fill="#000000"/>
    <rect x="56" y="5" width="5" height="35" fill="#000000"/>
    <rect x="64" y="5" width="3" height="35" fill="#000000"/>
    <rect x="70" y="5" width="4" height="35" fill="#000000"/>
    <rect x="77" y="5" width="2" height="35" fill="#000000"/>
    <rect x="82" y="5" width="6" height="35" fill="#000000"/>
    <rect x="91" y="5" width="3" height="35" fill="#000000"/>
    <rect x="97" y="5" width="2" height="35" fill="#000000"/>
    <rect x="102" y="5" width="5" height="35" fill="#000000"/>
    <rect x="110" y="5" width="4" height="35" fill="#000000"/>
    <rect x="117" y="5" width="3" height="35" fill="#000000"/>
    <rect x="123" y="5" width="5" height="35" fill="#000000"/>
    <rect x="131" y="5" width="2" height="35" fill="#000000"/>
    <rect x="136" y="5" width="4" height="35" fill="#000000"/>
    <rect x="143" y="5" width="3" height="35" fill="#000000"/>
    <rect x="149" y="5" width="5" height="35" fill="#000000"/>
    <text x="75" y="48" font-family="monospace" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">* 1 0 0 9 - 8 8 2 1 - 9 9 2 3 *</text>
  </g>

  <!-- Header Banner -->
  <g transform="translate(220, 28)">
    <text x="180" y="14" font-family="Arial, sans-serif" font-weight="900" font-size="14" fill="#166534" text-anchor="middle" letter-spacing="1">NATIONAL IDENTITY MANAGEMENT COMMISSION</text>
    <text x="180" y="32" font-family="Arial, sans-serif" font-weight="900" font-size="13" fill="#0f172a" text-anchor="middle" letter-spacing="1.5">NATIONAL ENROLMENT SHEET (NINS / LONG SLIP)</text>
    <text x="180" y="46" font-family="Arial, sans-serif" font-weight="700" font-size="10" fill="#64748b" text-anchor="middle">OFFICIAL CITIZEN BIOMETRIC &amp; DEMOGRAPHIC SUMMARY SLIP</text>
  </g>

  <!-- Right Logo & Badge -->
  <g transform="translate(630, 22)">
    <rect width="130" height="48" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="65" y="20" font-family="Arial, sans-serif" font-weight="900" font-size="10" fill="#15803d" text-anchor="middle">LONG SLIP</text>
    <text x="65" y="36" font-family="monospace" font-weight="700" font-size="11" fill="#0f172a" text-anchor="middle">SERIES 2026</text>
  </g>

  <!-- Divider Line -->
  <line x1="30" y1="80" x2="770" y2="80" stroke="#0f172a" stroke-width="2"/>

  <!-- Tracking Header Strip -->
  <rect x="30" y="90" width="740" height="32" rx="4" fill="#e2e8f0"/>
  <text x="45" y="111" font-family="Arial, sans-serif" font-weight="800" font-size="11" fill="#1e293b">TRACKING ID: 1009-8821-9923</text>
  <text x="350" y="111" font-family="Arial, sans-serif" font-weight="800" font-size="11" fill="#166534">NIN: 2234 5678 901</text>
  <text x="620" y="111" font-family="Arial, sans-serif" font-weight="700" font-size="10" fill="#475569">BATCH: LAG-2026-B04</text>

  <!-- Photo Box & Fingerprints Left Column -->
  <g transform="translate(40, 135)">
    <!-- Photo Box -->
    <rect width="125" height="150" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <circle cx="62" cy="180" r="30" fill="#94a3b8"/>
    <path d="M 25 255 C 25 215, 100 215, 100 255 Z" fill="#94a3b8"/>
    <text x="62" y="140" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#475569" text-anchor="middle">APPLICANT PHOTO</text>

    <!-- Fingerprint Capture Indicator -->
    <g transform="translate(0, 165)">
      <rect width="60" height="75" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="30" y="14" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#475569" text-anchor="middle">LEFT THUMB</text>
      <!-- Fingerprint lines -->
      <path d="M 30 25 C 20 35, 20 60, 30 70 M 25 30 C 17 40, 17 55, 25 65 M 35 30 C 43 40, 43 55, 35 65 M 30 35 C 25 45, 25 55, 30 60" fill="none" stroke="#64748b" stroke-width="1.2"/>

      <rect x="65" width="60" height="75" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="95" y="14" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#475569" text-anchor="middle">RIGHT THUMB</text>
      <path d="M 95 25 C 85 35, 85 60, 95 70 M 90 30 C 82 40, 82 55, 90 65 M 100 30 C 108 40, 108 55, 100 65 M 95 35 C 90 45, 90 55, 95 60" fill="none" stroke="#64748b" stroke-width="1.2"/>
    </g>

    <text x="62" y="258" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#16a34a" text-anchor="middle">✓ BIOMETRICS CAPTURED</text>
  </g>

  <!-- Main Long Form Demographic Grid -->
  <g transform="translate(185, 135)">
    <!-- Section 1 -->
    <rect width="440" height="22" rx="3" fill="#f1f5f9"/>
    <text x="10" y="15" font-family="Arial, sans-serif" font-size="9" font-weight="800" fill="#334155">1. PERSONAL BIOGRAPHICAL DATA</text>

    <text x="10" y="38" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#64748b">SURNAME:</text>
    <text x="10" y="52" font-family="Arial, sans-serif" font-size="12" font-weight="800" fill="#0f172a">SULAIMAN</text>

    <text x="160" y="38" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#64748b">FIRST NAME:</text>
    <text x="160" y="52" font-family="Arial, sans-serif" font-size="12" font-weight="800" fill="#0f172a">ADAMU</text>

    <text x="310" y="38" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#64748b">MIDDLE NAME:</text>
    <text x="310" y="52" font-family="Arial, sans-serif" font-size="12" font-weight="800" fill="#0f172a">GARBA</text>

    <text x="10" y="75" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#64748b">DATE OF BIRTH:</text>
    <text x="10" y="89" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">12-APR-1988</text>

    <text x="160" y="75" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#64748b">GENDER:</text>
    <text x="160" y="89" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">MALE</text>

    <text x="310" y="75" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#64748b">MARITAL STATUS:</text>
    <text x="310" y="89" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">MARRIED</text>

    <!-- Section 2 -->
    <g transform="translate(0, 105)">
      <rect width="440" height="22" rx="3" fill="#f1f5f9"/>
      <text x="10" y="15" font-family="Arial, sans-serif" font-size="9" font-weight="800" fill="#334155">2. ORIGIN &amp; RESIDENCE INFORMATION</text>

      <text x="10" y="38" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#64748b">STATE OF ORIGIN:</text>
      <text x="10" y="52" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">KANO STATE</text>

      <text x="160" y="38" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#64748b">LGA OF ORIGIN:</text>
      <text x="160" y="52" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">FAGGE LGA</text>

      <text x="310" y="38" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#64748b">NATIONALITY:</text>
      <text x="310" y="52" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">NIGERIAN</text>

      <text x="10" y="75" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#64748b">RESIDENTIAL ADDRESS:</text>
      <text x="10" y="89" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">14 AIRPORT ROAD, NO MANSLAND, KANO</text>
    </g>

    <!-- Section 3 -->
    <g transform="translate(0, 210)">
      <rect width="440" height="22" rx="3" fill="#f1f5f9"/>
      <text x="10" y="15" font-family="Arial, sans-serif" font-size="9" font-weight="800" fill="#334155">3. ENROLMENT FACILITATION METRICS</text>

      <text x="10" y="38" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#64748b">TELEPHONE:</text>
      <text x="10" y="52" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">08031234567</text>

      <text x="160" y="38" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#64748b">ENROLMENT DATE:</text>
      <text x="160" y="52" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">2026-10-16</text>

      <text x="310" y="38" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#64748b">DESK OPERATOR:</text>
      <text x="310" y="52" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">OP-HBT-091</text>
