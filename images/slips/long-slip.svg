    <text x="62" y="18" font-family="Arial, sans-serif" font-size="8" font-weight="800" fill="#1e293b" text-anchor="middle">VERIFICATION QR</text>
    <rect x="18" y="28" width="90" height="90" fill="#f8fafc" stroke="#cbd5e1"/>
    <!-- Simulated QR markers -->
    <rect x="23" y="33" width="22" height="22" fill="#0f172a"/>
    <rect x="26" y="36" width="16" height="16" fill="#ffffff"/>
    <rect x="29" y="39" width="10" height="10" fill="#0f172a"/>

    <rect x="81" y="33" width="22" height="22" fill="#0f172a"/>
    <rect x="84" y="36" width="16" height="16" fill="#ffffff"/>
    <rect x="87" y="39" width="10" height="10" fill="#0f172a"/>

    <rect x="23" y="91" width="22" height="22" fill="#0f172a"/>
    <rect x="26" y="94" width="16" height="16" fill="#ffffff"/>
    <rect x="29" y="97" width="10" height="10" fill="#0f172a"/>

    <rect x="52" y="55" width="22" height="22" fill="#166534" rx="2"/>

    <text x="62" y="132" font-family="monospace" font-size="7" font-weight="700" fill="#475569" text-anchor="middle">NINS-DIGITAL-KEY</text>
    <text x="62" y="142" font-family="Arial, sans-serif" font-size="7" font-weight="700" fill="#16a34a" text-anchor="middle">SECURE AUDIT</text>

    <!-- Signatures -->
    <g transform="translate(0, 165)">
      <rect width="125" height="75" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="62" y="16" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#64748b" text-anchor="middle">AUTHORIZED SIGNATURE</text>
      <!-- Simulated signature line -->
      <path d="M 20 45 Q 40 25 60 40 T 100 35" fill="none" stroke="#1e293b" stroke-width="1.8"/>
      <line x1="15" y1="52" x2="110" y2="52" stroke="#94a3b8" stroke-width="1"/>
      <text x="62" y="65" font-family="Arial, sans-serif" font-size="7" font-weight="700" fill="#0f172a" text-anchor="middle">DESK REGISTRAR</text>
    </g>
  </g>

  <!-- Bottom Notice -->
  <line x1="30" y1="440" x2="770" y2="440" stroke="#cbd5e1" stroke-width="1"/>
  <text x="400" y="460" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#334155" text-anchor="middle">
    OFFICIAL LONG FORMAT ENROLMENT SLIP — KEEP SECURE AS PRIMARY CITIZEN IDENTITY RECORD
