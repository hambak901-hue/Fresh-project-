<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>HAMBAKTECH | Digital Services, Telecom VTU &amp; Digital Training Academy</title>
    <meta name="description" content="HAMBAK TECH &amp; SERVICES (BN 9284726) — Where Technology Meets Services. Digital identity verification, telecom VTU, utility payments, and HAMBAKTECH Digital Training Academy in Lekki, Lagos State, Nigeria." />
    <meta property="og:title" content="HAMBAKTECH | Digital Services &amp; Digital Training Academy" />
    <meta property="og:description" content="Where Technology Meets Services — Telecom VTU, identity verification workflows, utility bill payments, and practical ICT &amp; software skills training." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Pre-hydration Theme Initialization (prevents Light/Night FOUC)
      (function() {
        try {
          var saved = localStorage.getItem('hambaktech_theme');
          var theme = (saved === 'dark' || saved === 'light')
            ? saved
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();

      // Ignore Vite HMR WebSocket connection errors in Cloud Run iframe environment per runtime constraints
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e && e.reason;
        var msg = reason && (reason.message || String(reason));
        var stack = reason && reason.stack;
        if (
          (msg && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1 || msg.indexOf('closed without opened') !== -1)) ||
          (stack && (stack.indexOf('@vite/client') !== -1 || stack.indexOf('WebSocket') !== -1))
        ) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(e) {
        var msg = e && (e.message || String(e));
        var file = e && e.filename;
        if (
          (msg && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1)) ||
          (file && file.indexOf('@vite/client') !== -1)
        ) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-blue-600 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
